# 黄金评测集 —— 设备手册知识库问答
#
# 评分方式：问答没有唯一正确的字符串，所以不做全文比对，而是分两层打分。
#
#   1. 检索命中率：正确的章节是否进入了精排后的上下文。
#      单独统计这一层，才能把「检索没找到」与「找到了但答错」区分开——
#      前者要调切分与检索策略，后者要调提示词，混在一个总分里就看不出改哪儿。
#
#   2. 答案关键事实覆盖率：答案中是否包含绕不开的关键信息。
#      用关键词而非整句比对，是因为同一事实有无数种表述，
#      但「192.168.0.241」这种具体参数是绕不开的。
#
# 本评测集基于知识库中实际存在的 11 份手册、1143 条切片编写，
# 每道题的答案都已逐条对照库中原文核实。设备与切片数如下：
#   178  H3C NR-1200W 企业级无线宽带路由器
#   167  Aolynk CC 系列室内型 Cable 网络集中器
#   162  H3C NER214W 路由器
#   157  H3C MER 系列路由器
#   147  H3C MSR WiNet 系列云简路由器
#   146  H3C MSR-XS 系列路由器
#   128  H3C ER2100 企业级路由器
#    34  Aolynk CB304n Cable 网桥
#    12  RS-PRO RS-12 数字万用表
#     7  HAK180 烫金机
#     5  H3C LA2608 室内无线网关
#
# ⚠️ 这批文档高度同质：七台路由器几乎都有「登录 Web 设置页面」
#    「恢复出厂设置」「缺省密码」等同名章节。这正是本评测集的价值所在——
#    L2 组专门用不指名设备的提问去检验系统会不会张冠李戴。
#
# 字段说明：
#   id              唯一编号
#   level           难度层级 L1~L7
#   question        用户提问
#   focus           该题考察的能力点
#   expect_sections 期望命中的章节标题，命中任意一个即算检索成功
#   expect_keywords 答案中必须出现的关键事实，按命中比例计分
#   forbid_keywords 不应出现的内容，出现即判错（用于捕捉张冠李戴与幻觉）
#   expect_refusal  期望模型如实表示无法回答

# ------------------------------------------------- L1 指名设备的事实查找
- id: L1-01
  level: L1
  question: Aolynk CC 系列集中器的缺省 IP 地址是多少
  focus: |
    单一参数事实。库里另有多台设备缺省 IP 为 192.168.1.1，
    只有集中器是 192.168.0.241，答错即说明串了设备。
  expect_sections: ["说明", "确认管理计算机与集中器连通"]
  expect_keywords: ["192.168.0.241"]
  forbid_keywords: ["192.168.1.1"]

- id: L1-02
  level: L1
  question: Aolynk CB304n 网桥的缺省 IP 地址是什么
  focus: 与上题构成对照：同类问题、不同设备、不同答案
  expect_sections: ["说明", "产品特点"]
  expect_keywords: ["192.168.1.1"]
  forbid_keywords: ["192.168.0.241"]

- id: L1-03
  level: L1
  question: H3C ER2100 路由器的 Web 登录用户名和密码是什么
  focus: 缺省凭据查找
  expect_sections: ["登录路由器Web设置页面"]
  expect_keywords: ["admin"]

- id: L1-04
  level: L1
  question: NR-1200W 路由器怎么恢复缺省登录密码
  focus: |
    具体操作参数：通电状态下用针状物按住 Reset 键 5 秒，
    直至诊断指示灯慢速闪烁。考察能否抽出「5 秒」这个关键数字。
  expect_sections: ["附录"]
  expect_keywords: ["Reset", "5"]

- id: L1-05
  level: L1
  question: CC600E 和 CC600E-AC60 有什么区别
  focus: 两个型号的差异在供电电压：AC 220V 与 AC 60V
  expect_sections: ["产品介绍"]
  expect_keywords: ["60V"]

- id: L1-06
  level: L1
  question: HAK180 烫金机的工作温度范围是多少
  focus: 非路由器设备，考察跨文档类型的检索
  expect_sections: ["设备", "警告"]
  expect_keywords: ["10", "32"]

# ------------------------------------------------- L2 跨设备歧义
# 这组题刻意不指名设备。知识库里七台路由器都有同名章节，
# 系统要么追问澄清，要么明确标注答案出自哪台设备；
# 直接给一个不说明出处的答案是最差的表现——用户会当成自己那台的参数。
- id: L2-01
  level: L2
  question: 缺省的登录密码是什么
  focus: |
    完全不指名设备。库中至少有 ER2100、NR-1200W、NER214W、CC 系列
    四台设备的缺省密码均为 admin，答案本身不难，
    难的是答案里必须交代这是哪台设备的参数。
  expect_keywords: ["admin"]

- id: L2-02
  level: L2
  question: 设备的缺省 IP 地址是多少
  focus: |
    高度歧义。CB304n 与 ER2100 是 192.168.1.1，
    CC 系列是 192.168.0.241，两者不可混为一谈。
    理想表现是列出不同设备分别的取值，或追问用户指的是哪台。
  expect_keywords: ["192.168"]

- id: L2-03
  level: L2
  question: 怎么恢复出厂设置
  focus: |
    七台设备的恢复方式各不相同：有的走 Web 页面「管理→设备管理→
    恢复出厂设置」，有的按 Reset 键。不交代设备就给步骤会误导用户。
  # 知识库中并无「恢复出厂设置」这一章节标题，相关内容散落在
  # 「配置管理」「设备管理」「说明」「注意」等标题之下
  expect_sections: ["配置管理", "设备管理", "说明", "注意"]

# ------------------------------------------------- L3 口语化提问
- id: L3-01
  level: L3
  question: ER2100 路由器网页打不开，登录地址是多少
  focus: 口语化描述故障，实际要的是缺省 IP
  expect_sections: ["登录路由器Web设置页面", "说明"]
  expect_keywords: ["192.168.1.1"]

- id: L3-02
  level: L3
  question: 集中器恢复出厂以后会怎么样
  focus: |
    对应「恢复出厂配置完成后，集中器将自动重新启动，网络通信将暂时中断」。
    口语提问，答案在注意事项段落里。
  expect_keywords: ["重新启动"]

- id: L3-03
  level: L3
  question: 万用表测电压有什么安全注意事项
  focus: |
    非路由器设备，口语化提问。关键事实是负极端口电压超过 500V
    以上接地电压时禁止进行电压测试。
  expect_sections: ["安全手册", "安全标识"]
  expect_keywords: ["500V"]

- id: L3-04
  level: L3
  question: 烫金机能不能用延长线
  focus: |
    否定式提问。正确答案是不建议使用。安全手册场景下方向答反
    比答不出来更糟。
  expect_keywords: ["不", "延长线"]
  forbid_keywords: ["可以使用延长线", "建议使用延长线"]

# ------------------------------------------------- L4 操作步骤类
- id: L4-01
  level: L4
  question: CB304n 网桥在哪个菜单里恢复出厂设置
  focus: 页面路径「管理→设备管理→恢复出厂设置」
  expect_sections: ["设备管理"]
  expect_keywords: ["管理"]

- id: L4-02
  level: L4
  question: 怎么确认电脑和 CC 系列集中器之间网络通不通
  focus: |
    操作步骤类。问的是「怎么确认连通」，正解是 Ping 集中器的管理 IP。
    注：子网掩码 255.255.255.0 属于前置配置步骤而非本题答案，
    最初把它设成唯一必答关键词，导致一个答对了 Ping 的回答被判失败。
  expect_sections: ["确认管理计算机与集中器连通", "说明"]
  expect_keywords: ["Ping"]

- id: L4-03
  level: L4
  question: 给电脑设静态 IP 时，CB304n 的子网掩码要填什么
  focus: 具体配置参数，答案是 255.255.255.0
  expect_sections: ["说明"]
  expect_keywords: ["255.255.255.0"]

- id: L4-04
  level: L4
  question: ER2100 恢复出厂设置后哪些配置会丢失
  focus: |
    对应原文「恢复到出厂设置后，当前的设置将会丢失」，且路由器会自动重启。
    注：此处关键词取「丢失」而非「缺省」——原文用的是前者，
    最初误设为「缺省」导致一个完全正确的回答被判失败。
  expect_keywords: ["丢失"]

# ------------------------------------------------- L5 跨文档综合
- id: L5-01
  level: L5
  question: 知识库里都有哪些设备的手册
  focus: |
    元信息类提问。理想表现是列举若干设备名。
    这题检索层面没有唯一正确章节，主要看是否胡编不存在的设备。
  forbid_keywords: ["华为", "小米", "TP-LINK"]

- id: L5-02
  level: L5
  question: H3C 的路由器缺省用户名密码都是 admin 吗
  focus: |
    跨多台同品牌设备的归纳。ER2100、NR-1200W、NER214W 均为 admin/admin，
    考察能否从多个片段归纳出一致结论。
  expect_keywords: ["admin"]

# ------------------------------------------------- L6 图片关联
- id: L6-01
  level: L6
  question: ER2100 的 Web 登录界面长什么样
  focus: |
    答案应引用登录页截图。导入时图片描述已写进 Markdown 的 alt 文本，
    检索侧从正文解析出图片链接。考察图文关联是否打通。
  expect_sections: ["登录路由器Web设置页面"]
  expect_keywords: ["登录"]

- id: L6-02
  level: L6
  question: 万用表上的警告标识是什么意思
  focus: 对应安全标识章节，含 WARNING / CAUTION 说明与配图
  expect_sections: ["安全标识"]
  expect_keywords: ["危险"]

# ------------------------------------------------- L7 边界与拒答
# 这组题在知识库中没有答案，考察系统是否如实告知而非编造。
# 设备手册场景下编造参数的后果远比答不出来严重——
# 用户照着一个虚构的电压值接线可能损坏设备甚至造成人身伤害。
- id: L7-01
  level: L7
  question: 小米路由器怎么设置
  focus: 知识库中没有小米设备，应明确告知而非拿 H3C 的步骤搪塞
  expect_refusal: true

- id: L7-02
  level: L7
  question: ER2100 路由器卖多少钱
  focus: 手册不含价格信息
  expect_refusal: true

- id: L7-03
  level: L7
  question: NR-1200W 的无线吞吐量实测能跑到多少 Mbps
  focus: |
    手册给出了标称速率 1200 Mbps，但没有任何实测数据。
    正确表现是把标称值给出来、同时讲清楚这是理论最大值而非实测结果；
    直接拿标称值当实测答案则是答非所问。

    这题最初被设为纯拒答题，属于断言过强——手册确实有可用信息，
    要求系统什么都不说反而不合理。真正该考察的是它能否区分
    「标称」与「实测」，而不是能否闭嘴。
  expect_keywords: ["1200"]
  forbid_keywords: ["实测可达", "实测为", "实际测得"]

- id: L7-04
  level: L7
  question: 这些路由器的保修期是几年
  focus: |
    最容易诱发幻觉的一类：手册中确实出现过「保修」字样，
    相关段落也召回得到，但里面并没有用户要的那个年限。
  expect_refusal: true
